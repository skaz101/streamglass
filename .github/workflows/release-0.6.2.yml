name: Publish StreamGlass Android 0.6.2 preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-0.6.2.yml]
permissions:
  contents: read
concurrency:
  group: publish-streamglass-0.6.2
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'skaz101/streamglass' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: skaz101/streamglass
      SOURCE_COMMIT: 889b71b848d320c386b8233d2434d62a0bd2f868
      VALIDATED_COMMIT: 15d9321862bb2f428f662004c736039b80bd0aed
      VALIDATION_RUN: 41402266011
      APK_BLOB: b7eac35f5482439a25e9e3cf70470b99fdbb58b7
      APK_SHA256: c3f595fcf291eea4eb249627b2fc3ab52988a343170f1040bc8d082f88524da7
      PREVIEW_BLOB: 9bb194fa65da6ed4b1e252037004b83880d49310
      TAG: v0.6.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 889b71b848d320c386b8233d2434d62a0bd2f868
          fetch-depth: 2
          persist-credentials: false
      - name: Verify tested source and preserve published releases
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$VALIDATION_RUN" > "$RUNNER_TEMP/validation.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'validation.json').read_text())
          assert result['conclusion']=='success'
          assert result['head_sha']==os.environ['VALIDATED_COMMIT']
          PY
          git diff --exit-code "$VALIDATED_COMMIT" "$SOURCE_COMMIT" -- android webos dxbi.theme.css
          gh api "repos/$GH_REPO/releases" --paginate > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          releases=json.loads((Path(os.environ['RUNNER_TEMP'])/'releases.json').read_text())
          assert not any(r['tag_name']==os.environ['TAG'] for r in releases), 'Release exists; preserve it.'
          PY
      - name: Prepare locally signed APK and corresponding source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/streamglass-release"
          gh api "repos/$GH_REPO/git/blobs/$APK_BLOB" > "$RUNNER_TEMP/apk-blob.json"
          gh api "repos/$GH_REPO/git/blobs/$PREVIEW_BLOB" > "$RUNNER_TEMP/preview-blob.json"
          python3 - <<'PY'
          import base64,hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);folder=root/'streamglass-release'
          for kind,name in [('apk','streamglass-android-0.6.2.apk'),('preview','android-appearance-preview.webp')]:
              blob=json.loads((root/(kind+'-blob.json')).read_text())
              assert blob['encoding']=='base64'
              data=base64.b64decode(blob['content'])
              if kind=='apk':assert hashlib.sha256(data).hexdigest()==os.environ['APK_SHA256']
              (folder/name).write_bytes(data)
          with zipfile.ZipFile(folder/'streamglass-android-0.6.2.apk') as archive:
              assert archive.testzip() is None
              for member,source in [('assets/app/mobile.js','android/ui/mobile.js'),('assets/app/mobile.css','android/ui/mobile.css'),('assets/app/android-host.js','android/ui/android-host.js')]:
                  assert archive.read(member)==Path(source).read_bytes(), member+' differs from source'
          PY
          python3 webos/tests/source_archive_test.py
          python3 webos/scripts/source-archive.py --version 0.6.2
          cp webos/dist/streamglass-0.6.2-source.zip "$RUNNER_TEMP/streamglass-release/"
          python3 - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'streamglass-release'
          with zipfile.ZipFile(folder/'streamglass-0.6.2-source.zip') as archive:
              assert archive.testzip() is None
              assert not any('/signing/' in n or Path(n).suffix.lower() in {'.jks','.keystore','.p12','.pfx','.pem','.key','.apk','.ipk'} for n in archive.namelist())
          entries=[f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in sorted(folder.iterdir())]
          (folder/'SHA256SUMS').write_text('\n'.join(entries)+'\n')
          PY
      - name: Draft, verify asset digests, and publish preview
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Personalize StreamGlass with new appearance themes, synced profile details and a cleaner search experience.

          **Install:** download **streamglass-android-0.6.2.apk** and install over your existing StreamGlass preview. Android 8.0 or later. Your app data stays in place; no uninstall needed.

          - Classic, Amethyst purple and OLED browsing themes, applied immediately and saved locally.
          - Appearance controls replace the StreamGlass information button in Settings.
          - Stremio email and avatar in the profile menu, with an initial fallback and signed-in profile refresh.
          - Main-tab fades and a moving active-tab indicator.
          - Refined search bar, clear button and responsive poster-grid results.
          - Clear MOVIE and SERIES labels on featured titles.

          **Brand:** stays StreamGlass. **LG:** remains on [0.4.0](https://github.com/skaz101/streamglass/releases/tag/v0.4.0).

          [Validation passed](https://github.com/skaz101/streamglass/actions/runs/41402266011): 40 shared tests, six Android JVM tests, source-export regression, six browser suites, webOS packaging, Android debug/release compilation and lint. Browser motion tests cover real intermediate frames, sheet entry/exit, repeated Back, interrupted dismissal and reduced motion. An Android 35 emulator with animations enabled exercised real H.264/AAC playback, full-screen scrim bounds, fade reversal, system reduced motion, seeking, audio/subtitle selection, rotation, lock, lifecycle and recovery. The included preview shows the Amethyst appearance settings. Theme persistence, OLED backgrounds, profile display and search clearing are covered by the mobile suite.

          This is a **preview**. Physical phones, actual addon/debrid links and device-specific codecs still need testing. The emulator uses local generated media; it does not establish compatibility with every format.

          The release-configured APK disables WebView debugging and excludes test media. It retains the original development certificate for preview updates. Certificate SHA-256: `167c739ded0846e2e7e31884cef42ec58d1154e1145740c1a6ced15d4f9f3ead`.

          `streamglass-0.6.2-source.zip` is the corresponding source with notices and no signing keys. `SHA256SUMS` covers all other assets. The appearance preview uses an isolated test account.

          [Install and build guide](https://github.com/skaz101/streamglass/blob/889b71b848d320c386b8233d2434d62a0bd2f868/android/README.md) · [Full release notes](https://github.com/skaz101/streamglass/blob/889b71b848d320c386b8233d2434d62a0bd2f868/android/RELEASE-0.6.2.md)

          GPL-3.0-or-later. StreamGlass is independent and is not affiliated with Netflix, Stremio, DX.BI or LG.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/streamglass-release/"* --target "$SOURCE_COMMIT" --title 'StreamGlass Android 0.6.2 Preview' --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease
          gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v0.6.2")' > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);release=json.loads((root/'release.json').read_text())
          assert release['draft'] and release['prerelease']
          assets={a['name']:a for a in release['assets']};files=list((root/'streamglass-release').iterdir())
          assert set(assets)=={p.name for p in files}
          for path in files:
              asset=assets[path.name]
              assert asset['state']=='uploaded' and asset['size']==path.stat().st_size
              assert asset['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          gh release edit "$TAG" --draft=false --prerelease
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets
