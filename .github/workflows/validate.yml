name: Validate StreamGlass
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamglass-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - run: npm ci
        working-directory: webos
      - run: npm test
        working-directory: webos
      - run: python3 webos/tests/source_archive_test.py
      - run: npm run build:core && npm run build && npm run package
        working-directory: webos
      - run: npx playwright install --with-deps chromium
        working-directory: webos
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Browser integration
        working-directory: webos
        run: |
          node tests/core-browser.mjs
          node tests/player-browser.cjs
          node tests/review-host-browser.cjs
          node tests/tv-navigation-browser.cjs
          node tests/search-host-browser.cjs
          node tests/browse-performance-browser.cjs
          node tests/motion-browser.cjs
          node tests/react-browser.cjs
          node tests/hero-browser.cjs
          node tests/curated-browser.cjs
          npm run test:browser
          node ../android/scripts/sync-assets.mjs
          node ../android/tests/mobile-browser.mjs
      - run: python3 webos/scripts/source-archive.py --version 0.8.2
      - uses: actions/upload-artifact@v4
        with:
          name: webos-and-source
          path: webos/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            webos/test-results/
            android/test-results/
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
        working-directory: webos
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 android/tests/make-player-fixture.py
      - run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest lintDebug lintRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-build
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native player on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          script: bash android/scripts/test-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-player-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/test-results/native/
